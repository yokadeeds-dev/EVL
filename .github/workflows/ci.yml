name: CI/CD

# Build · Test · Scan · Deploy für den EVL-Prototyp (03_Prototyp/)
#   backend  — FastAPI + RAG (Python 3.11)
#   frontend — React + Vite (Node 20)
#
# Gates bei jedem Pull Request: Lint, Tests, Frontend-Build, CodeQL, Image-Build.
# Push nach GHCR + Deploy-Gate nur auf main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── 1. Backend · Lint (ruff) + E2E-Tests gegen key-freies Mock-Backend ──────
  backend:
    name: Backend · Lint & Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: evl
          POSTGRES_PASSWORD: evl
          POSTGRES_DB: evl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evl -d evl"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 03_Prototyp/backend/requirements.txt

      - name: Test-Tooling + App-Deps installieren (ohne sentence-transformers/torch)
        working-directory: 03_Prototyp/backend
        run: |
          pip install ruff
          # App-Deps fuer die echten main.py-Tests (test_api) und pgvector — aber
          # ohne sentence-transformers/torch: die Tests nutzen use_real_model=False.
          grep -v '^sentence-transformers' requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt

      - name: Lint (ruff — Gate)
        working-directory: 03_Prototyp/backend
        run: ruff check . --output-format=github

      - name: Tests · E2E (Mock) · Redis · Postgres/pgvector · echte API
        working-directory: 03_Prototyp/backend
        env:
          BASE_URL: http://127.0.0.1:18000
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql://evl:evl@localhost:5432/evl
          JWT_SECRET_KEY: test-secret-key-nur-fuer-ci-0123456789abcdef
          ANTHROPIC_API_KEY: test-dummy-not-used
        run: |
          # mock_server.py ist ein reines-stdlib-Backend (keine Keys, kein LLM)
          # und teilt die Test-API-Keys mit test_e2e.py.
          python -c "from mock_server import run; run().serve_forever()" &
          MOCK_PID=$!
          for i in $(seq 1 40); do
            curl -sf "$BASE_URL/status" >/dev/null && break
            sleep 0.25
          done
          # laeuft die gesamte Suite: E2E gegen Mock, Redis-, pgvector- und echte
          # main.py-Tests (test_api gegen den Postgres-Service, LLM gemockt).
          pytest -v
          kill "$MOCK_PID" 2>/dev/null || true

  # ── 2. Frontend · Production-Build (Vite) ──────────────────────────────────
  frontend:
    name: Frontend · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 03_Prototyp/frontend/package-lock.json

      - name: Install
        working-directory: 03_Prototyp/frontend
        run: npm ci

      - name: Typecheck (tsc — Gate)
        working-directory: 03_Prototyp/frontend
        run: npm run typecheck

      - name: Build
        working-directory: 03_Prototyp/frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: 03_Prototyp/frontend/dist
          if-no-files-found: error

  # ── 3. Scan · CodeQL (SAST) für Python + JavaScript ────────────────────────
  codeql:
    name: Scan · CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ── 4. Build & Push · Container-Images (+ Trivy-Scan) ──────────────────────
  #   Build läuft bei jedem PR (verifiziert das reproduzierbare Packaging);
  #   Push nach GHCR nur auf main / manuellem Dispatch.
  docker:
    name: Build & Push Images
    needs: [backend, frontend, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Registry-Namespace (lowercase)
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR Login
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend-Image bauen (Push nur auf main)
        uses: docker/build-push-action@v6
        with:
          context: 03_Prototyp/backend
          push: ${{ env.PUSH }}
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/evl-backend:latest
            ghcr.io/${{ steps.ns.outputs.owner }}/evl-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend-Image bauen (Push nur auf main)
        uses: docker/build-push-action@v6
        with:
          context: 03_Prototyp/frontend
          push: ${{ env.PUSH }}
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/evl-frontend:latest
            ghcr.io/${{ steps.ns.outputs.owner }}/evl-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy · Backend-Image scannen (report-only)
        if: env.PUSH == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.ns.outputs.owner }}/evl-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Trivy-Ergebnis in den Security-Tab
        if: env.PUSH == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  # ── 5. Deploy · Production (Approval-Gate, Gerüst) ─────────────────────────
  #   Läuft nur auf main. Das Environment "production" kann im Repo mit
  #   "Required reviewers" versehen werden → manuelles Freigabe-Gate vor Prod.
  deploy:
    name: Deploy · Production
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy-Schritt (Ziel hier einhängen)
        run: |
          echo "Images liegen in GHCR bereit:"
          echo "  ghcr.io/<owner>/evl-backend:${GITHUB_SHA}"
          echo "  ghcr.io/<owner>/evl-frontend:${GITHUB_SHA}"
          echo ""
          echo "TODO: Deploy-Target anbinden, z. B. auf dem Zielserver:"
          echo "  docker compose pull && docker compose up -d"
          echo "oder K8s: kubectl set image / rollout."
