version: "3.9"

services:

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      # Wissensbasis und ChromaDB persistent auf dem Host
      - ./backend/knowledge_base:/app/knowledge_base
      - chroma_data:/app/chroma_db
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  chroma_data:
