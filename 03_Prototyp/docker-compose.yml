version: "3.9"

services:

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # ueberschreibt REDIS_URL aus .env: Redis ist im Compose-Netz unter "redis" erreichbar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      # Wissensbasis und ChromaDB persistent auf dem Host
      - ./backend/knowledge_base:/app/knowledge_base
      - chroma_data:/app/chroma_db
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  chroma_data:
